version: "3.9"

services:
  fact-extractor-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mws_fact_extractor_cpu
    ports:
      - "8000:8000"
    environment:
      - INFERENCE_MODE=point1_cpu
      - PYTHONHASHSEED=42
    restart: unless-stopped

  fact-extractor-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mws_fact_extractor_gpu
    ports:
      - "8001:8000"
    environment:
      - INFERENCE_MODE=point2_05b
      - MODEL_ID=Qwen/Qwen2.5-0.5B-Instruct
      - WEIGHTS_PATH=/app/weights/final_adapter
      - PYTHONHASHSEED=42
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
